spring.application.name=dzimbahub-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dzimbahub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ---- JWT (set APP_JWT_SECRET to a random secret of at least 32 characters in deployment settings)
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-change-this-32chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS: comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---- First administrator (created on start-up only if no ADMIN account exists).
# The defaults are for local development only. Set real values in deployment settings.
app.admin.email=${ADMIN_EMAIL:admin@dzimbahub.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:+263770000000}

# ---- Demo data (two landlords, one tenant and six listings). Set SEED_DEMO_DATA=false in production.
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo#12345}

# ---- Text-message (SMS) one-time code used as the second sign-in step
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# DEVELOPMENT ONLY: when true the login response also contains the code so it can be shown on screen.
app.otp.expose-code=${OTP_EXPOSE_CODE:false}
# console = write the SMS to the server log (development); twilio = send a real SMS through Twilio
app.sms.provider=${SMS_PROVIDER:console}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}
