spring.application.name=dzimbahub-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dzimbahub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ---- JWT (set APP_JWT_SECRET to a random secret of at least 32 characters in deployment settings)
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-change-this-32chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS: comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---- First administrator (created on start-up only if no ADMIN account exists).
# The defaults are for local development only. Set real values in deployment settings.
app.admin.email=${ADMIN_EMAIL:admin@dzimbahub.local}
app.admin.password=${ADMIN_PASSWORD:Admin#12345}
app.admin.full-name=${ADMIN_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:+263770000000}

# ---- Demo data (two landlords, one tenant and six listings). Set SEED_DEMO_DATA=false in production.
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Demo#12345}

# ---- One-time code used as the second sign-in step (WhatsApp or SMS)
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# DEVELOPMENT ONLY: when true the login response also contains the code so it can be shown on screen.
app.otp.expose-code=${OTP_EXPOSE_CODE:false}
# console = write the SMS to the server log (development); twilio = send a real SMS through Twilio
app.sms.provider=${SMS_PROVIDER:console}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}

# Which channel delivers sign-in codes: sms (default), twilio-whatsapp (Twilio WhatsApp Sandbox) or whatsapp (Meta Cloud API)
app.otp.channel=${OTP_CHANNEL:sms}
# WhatsApp Business Cloud API (Meta). Needs an APPROVED "Authentication" template with a copy-code button.
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
app.whatsapp.language-code=${WHATSAPP_TEMPLATE_LANG:en}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v26.0}
# Used to turn local numbers such as 0771234567 into 263771234567
app.whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:263}
# If WhatsApp fails, send the code by SMS instead of failing the login
app.whatsapp.fallback-to-sms=${WHATSAPP_FALLBACK_TO_SMS:true}
# Twilio WhatsApp (OTP_CHANNEL=twilio-whatsapp). Uses TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN above.
app.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
# Optional: ContentSid of the "Your {{1}} code is {{2}}" template
app.twilio.whatsapp.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}

# ---- Listing photos uploaded from the landlord's device (stored in the database)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ---- Second sign-in step
# totp = authenticator app such as Google Authenticator (set up by scanning a QR code at first sign-in)
# code = a six-digit code sent through OTP_CHANNEL / SMS_PROVIDER
app.auth.second-factor=${AUTH_SECOND_FACTOR:totp}
# Offer "Get a code another way" on the login page. The code goes through OTP_CHANNEL / SMS_PROVIDER;
# with SMS_PROVIDER=console it is written to the server log (Render -> Logs).
app.auth.allow-code-fallback=${AUTH_CODE_FALLBACK:true}
# Name shown in the authenticator app
app.totp.issuer=${TOTP_ISSUER:DzimbaHub}
# Key used to encrypt authenticator secrets in the database. Defaults to the JWT secret.
# If this key changes, everyone must set up their authenticator again.
app.totp.encryption-key=${TOTP_ENCRYPTION_KEY:${app.jwt.secret}}

# ---- Booking payments
# simulated = the demo "Confirm (simulated payment)" button, no money moves
# paynow    = real payments through Paynow (EcoCash, OneMoney, and Paynow's web page for cards and other options)
app.payments.provider=${PAYMENT_PROVIDER:simulated}
# From Paynow: Receive Payments -> Integration keys (create an integration of type "3rd party shopping cart or link")
app.paynow.integration-id=${PAYNOW_INTEGRATION_ID:}
app.paynow.integration-key=${PAYNOW_INTEGRATION_KEY:}
# Paynow merchant account e-mail. REQUIRED for EcoCash / OneMoney, and in test mode it must be the account's own e-mail.
app.paynow.auth-email=${PAYNOW_AUTH_EMAIL:}
# This API's public address (Paynow sends payment results to it). Render sets RENDER_EXTERNAL_URL automatically.
app.public-api-url=${PUBLIC_API_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
# The website's address (Paynow sends the customer back here after paying on its page)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
