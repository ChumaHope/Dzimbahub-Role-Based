services:
  - type: web
    name: dzimbahub-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000
      - key: PORT
        value: 8080
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: SEED_DEMO_DATA
        value: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: OTP_CHANNEL
        value: sms        # change to twilio-whatsapp in the dashboard when the sandbox is ready
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: WHATSAPP_FALLBACK_TO_SMS
        value: true
